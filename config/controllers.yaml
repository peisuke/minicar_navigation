local_nav_node:
  ros__parameters:
    # コントローラータイプ: "p", "pd"
    controller_type: "pd"

    # プランナーパラメータ
    planner:
      # 方向バイアス（度）: 正=左寄り、負=右寄り
      # 例: -30.0 → 右30°方向を「直進」として扱う（時計回り優先）
      direction_bias_deg: 0.0

    # 共通パラメータ
    common:
      lookahead_distance: 0.2
      target_velocity: 0.3
      max_angular_velocity: 1.5
      goal_tolerance: 0.1

    # コントローラー固有パラメータ
    controllers:
      p:
        # P制御は共通パラメータのみ使用
        dummy: 1

      pd:
        kp_angular: 4.5
        kd_angular: 0.8
        k_curvature: 4.0
        curvature_lookahead: 10
        min_velocity: 0.08
